audio:
  path: "../../I didnt ask to be the devil.flac"
  volume: 1.0
  sensitivity: 1.0

background:
  path: "../../I didn't ask to be the devil"
  fit_mode: "cover"
  opacity: 0.9
  darken: 0.15
  vignette: 0.30

background_effects:
  bass_zoom:
    enabled: true
    max_zoom: 1.05
    sensitivity: 1.0
  chromatic_aberration:
    enabled: true
    max_shift: 6.0
    mode: "horizontal"
    react_to: "bass"
  ripple:
    enabled: true
    amplitude: 4.0
    frequency: 0.03
    speed: 1.2
  glitch:
    enabled: false
  color_flash:
    enabled: true
    brightness_boost: 0.12

visualizer:
  enabled: true
  type: "horizontal"
  stereo_symmetric: true
  bars: 48
  min_height: 4.0
  max_height: 160.0
  bar_width: 7.0
  bar_gap: 3.0
  roundness: 3.0
  smoothing: 0.78
  position_y: 0.88
  mirror_bottom: true
  color_mode: "gradient"
  gradient:
    - offset: 0.0
      color: "#ff5e36"   # Sunset Orange
    - offset: 0.5
      color: "#9b51e0"   # Synthwave Violet
    - offset: 1.0
      color: "#00c9ff"   # Electric Blue
  glow:
    enabled: true
    radius: 14.0
    intensity: 0.70

particles:
  enabled: true
  type: "rising_sparks"
  count: 80
  min_size: 2.0
  max_size: 5.0
  color: "#ffb300"
  speed: 1.2
  audio_boost: 2.5
  glow: true

output:
  path: "synthwave_output.mp4"
  width: 0
  height: 0
  fps: 60
  codec: "libx264"
  preset: "fast"
  crf: 18
