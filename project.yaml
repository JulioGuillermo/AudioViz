# ==============================================================
# AudioViz - "I didn't ask to be the devil"  (estética: fuego)
# Documentación completa de cada opción: docs/index.md
# ==============================================================

audio:
  path: "I didnt ask to be the devil.flac"
  volume: 1.0
  sensitivity: 1.0
  normalize: true        # Cada efecto/barra se reescala a su rango local: nada se queda clavado
  normalize_window: 4.0  # Segundos a cada lado de la ventana de normalización

background:
  path: "I didn't ask to be the devil"
  fit_mode: "cover"
  opacity: 1.0
  darken: 0.10
  vignette: 0.30
  loop_video: true

# Reparto por frecuencias:
#   graves  -> zoom, temblor de cámara y flash de brillo (el "golpe")
#   medios  -> aberración cromática
#   agudos  -> ondulación tipo calor sobre el fuego y glitch en los picos
background_effects:
  bass_zoom:
    enabled: true
    max_zoom: 1.06
    sensitivity: 1.0
    react_to: "bass"

  shake:
    enabled: true
    amplitude: 5.0       # píxeles
    speed: 1.0
    react_to: "bass"

  chromatic_aberration:
    enabled: true
    max_shift: 7.0
    mode: "radial"
    react_to: "mid"

  ripple:
    enabled: true
    amplitude: 2.5       # distorsión suave tipo aire caliente
    frequency: 0.025
    speed: 1.2
    react_to: "treble"

  glitch:
    enabled: true
    react_to: "treble"   # solo en picos muy altos de agudos
    threshold: 0.93
    intensity: 0.25

  color_flash:
    enabled: true
    brightness_boost: 0.12
    contrast_boost: 0.10
    react_to: "bass"

# Barras que salen del borde inferior como llamas: rojo oscuro en la base,
# naranja/amarillo solo cuando la barra se acerca al máximo (gradient_fit: max)
visualizer:
  enabled: true
  type: "horizontal"
  bars: 48
  min_height: 3.0
  max_height: 230.0
  bar_width: 6.0
  bar_gap: 3.0
  roundness: 3.0
  smoothing: 0.75
  decay_rate: 0.12
  position_y: 1.0        # base de las barras en el borde inferior
  mirror_bottom: false
  color_mode: "gradient"
  gradient_axis: "length"  # a lo largo de cada barra (base -> punta)
  gradient_fit: "max"      # el último color está en max_height
  gradient:
    - offset: 0.0
      color: "#7a0000"   # brasa
    - offset: 0.45
      color: "#e0220a"   # rojo fuego
    - offset: 0.8
      color: "#ff7a1a"   # naranja
    - offset: 1.0
      color: "#ffc04d"   # punta amarilla
  glow:
    enabled: true
    radius: 16.0
    intensity: 0.8

# Chispas de fuego subiendo: una capa por banda. Cantidad e intensidad siguen a su banda.
particles:
  enabled: true
  layers:
    - type: "rising_sparks"   # graves: brasas grandes y rojas
      react_to: "bass"
      count: 90
      min_density: 0.15
      min_size: 1.8
      max_size: 4.0
      color: "#ff3a0a"
      color_end: "#6e0a00"
      speed: 0.9
      audio_boost: 1.5
      turbulence: 0.6
      min_life: 1.5
      max_life: 3.5
      glow: true

    - type: "rising_sparks"   # medios: chispas naranjas
      react_to: "mid"
      count: 110
      min_density: 0.15
      min_size: 1.5
      max_size: 4.0
      color: "#ff8c1a"
      color_end: "#b82a00"
      speed: 1.3
      audio_boost: 1.5
      turbulence: 0.8
      min_life: 1.2
      max_life: 3.0
      glow: true

    - type: "rising_sparks"   # agudos: chispitas amarillas brillantes y rápidas
      react_to: "treble"
      count: 140
      min_density: 0.1
      min_size: 0.8
      max_size: 2.2
      color: "#fff0a0"
      color_end: "#ff9500"
      speed: 1.8
      audio_boost: 2.0
      turbulence: 1.0
      min_life: 0.8
      max_life: 2.2
      glow: true

output:
  path: "output.mp4"
  width: 0               # 0 = tamaño del fondo
  height: 0
  fps: 60
  renderer: "auto"       # auto (GPU Vulkan, cae a CPU), gpu, cpu
  gpu_device: -1
  preset: "fast"         # preset x264: ultrafast ... veryslow
  crf: 20                # calidad (18 = muy alta, 23 = estándar, más alto = archivo más pequeño)
