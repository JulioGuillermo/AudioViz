# ==============================================================
# AudioViz - Archivo de Configuración de Proyecto
# ==============================================================

# 1. Pista de Audio
audio:
  path: "I didnt ask to be the devil.flac"
  volume: 1.0         # Multiplicador de volumen (1.0 = normal)
  sensitivity: 1.0    # Sensibilidad general de la reactividad visual

# 2. Fondo (Imagen o Video)
background:
  path: "I didn't ask to be the devil"   # Ruta a imagen o video
  fit_mode: "cover"                      # "cover", "contain", "stretch"
  opacity: 0.90                          # Opacidad (0.0 a 1.0)
  darken: 0.12                           # Oscurecimiento base para resaltar el espectrograma
  vignette: 0.25                         # Sombra de viñeta en los bordes (0.0 a 1.0)
  loop_video: true                       # Repetir si el fondo es video y dura menos que el audio

# 3. Efectos de Distorsión Reactivos sobre el Fondo
background_effects:
  # Zoom y bombeo al compás de los graves (kicks, bajo)
  bass_zoom:
    enabled: true
    max_zoom: 1.07       # 1.07 = hasta 7% de aumento en picos de graves
    sensitivity: 1.2     # Reacción a frecuencias bajas
    decay_speed: 0.15    # Velocidad de retorno elástico

  # Separación cromática de canales RGB
  chromatic_aberration:
    enabled: true
    max_shift: 8.0       # Píxeles máximos de desplazamiento entre canales
    mode: "radial"       # "radial" (desde el centro) o "horizontal"
    react_to: "bass"     # "bass", "treble", "transient", "overall"

  # Ondulación de agua / deformación senoidal
  ripple:
    enabled: false
    amplitude: 6.0       # Amplitud de onda en píxeles
    frequency: 0.04
    speed: 1.5

  # Glitch / Fallo digital en transitorios fuertes
  glitch:
    enabled: true
    threshold: 0.65      # Sensibilidad (más bajo = más frecuente)
    intensity: 0.35      # Desplazamiento de scanlines

  # Flashes de iluminación al compás del ritmo
  color_flash:
    enabled: true
    brightness_boost: 0.18
    contrast_boost: 0.12

# 4. Visualizador / Espectrograma de Audio
visualizer:
  enabled: true
  # Tipos disponibles:
  # - "circular": Anillo central simétrico (L a la izquierda, R a la derecha)
  # - "horizontal": Barras en la base saliendo desde el centro
  # - "vertical": Barras en los laterales saliendo desde los bordes
  # - "oscilloscope": Líneas de onda neón estilo osciloscopio
  type: "circular"
  stereo_symmetric: true # L canal izquierdo, R canal derecho
  bars: 56               # Cantidad de bandas por canal
  min_height: 4.0        # Altura mínima de las barras
  max_height: 180.0      # Altura máxima en picos
  bar_width: 5.0         # Grosor de cada barra
  bar_gap: 3.5           # Espacio entre barras
  roundness: 2.5         # Bordes redondeados en las puntas
  smoothing: 0.75        # Suavidad de transición (0.0 muy brusco, 0.95 muy suave)
  decay_rate: 0.12       # Caída de picos tras un golpe

  # Ajustes para tipo circular:
  radius: 200.0          # Radio del círculo central
  center_x: 0.5          # Posición horizontal (0.5 = centro)
  center_y: 0.5          # Posición vertical (0.5 = centro)

  # Ajustes para tipo horizontal:
  position_y: 0.85       # Altura relativa (0.85 = parte inferior)
  mirror_bottom: true    # Reflejo hacia abajo con transparencia

  # Colores y estilo de iluminación:
  color_mode: "gradient" # "gradient" o "solid"
  solid_color: "#00f0ff"
  gradient:
    - offset: 0.0
      color: "#00f0ff"   # Cyan neón
    - offset: 0.5
      color: "#9b51e0"   # Púrpura eléctrico
    - offset: 1.0
      color: "#ff007f"   # Rosa neón

  # Resplandor neón alrededor del espectrograma
  glow:
    enabled: true
    radius: 12.0
    intensity: 0.65

# 5. Sistema de Partículas Reactivo
particles:
  enabled: true
  # Tipos disponibles:
  # - "radial_burst": Explosión desde el centro impulsada por el ritmo
  # - "ambient_dust": Motes de polvo flotante cinematográfico
  # - "rising_sparks": Chispas ascendentes desde la base
  type: "radial_burst"
  count: 120            # Número de partículas
  min_size: 1.5
  max_size: 5.0
  color: "#ffffff"
  speed: 1.5
  audio_boost: 3.0       # Aceleración en los picos de audio
  glow: true

# 6. Salida de Video
output:
  path: "output.mp4"
  width: 0               # 0 = adapta automáticamente a las dimensiones de la imagen/video
  height: 0              # 0 = adapta automáticamente
  fps: 60                # Cuadros por segundo (ej. 30 o 60)
  codec: "libx264"       # Códec de video
  preset: "fast"         # ultrafast, superfast, veryfast, faster, fast, medium
  crf: 18                # Calidad (18 = alta fidelidad visual, 23 = estándar)
  audio_bitrate: "320k"  # Calidad del audio de salida
